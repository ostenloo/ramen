[package]
name = "ramen-mint"
description = "Out-of-band token minter for Ramen (root key management + Biscuit tokens)"
version.workspace = true
edition.workspace = true

[dependencies]
biscuit-auth = { workspace = true }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
# Test-only: e2e_guard.rs runs the real minter binary against the real guard.
ramen-guard = { path = "../../crates/ramen-guard" }
ramen-proto = { path = "../../crates/ramen-proto" }
tempfile = { workspace = true }
