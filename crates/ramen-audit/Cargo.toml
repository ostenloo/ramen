[package]
name = "ramen-audit"
version = "0.1.0"
edition = "2021"

[dependencies]
# The audit log reuses the wire types (RequestId/SessionId/Reversibility) and
# the frame encoder from ramen-proto — one framing implementation for the
# whole system (02-audit.md: framing mirrors the wire protocol).
ramen-proto = { path = "../ramen-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Only the `sync` feature (oneshot for the group-commit writer's replies).
# No runtime feature: the writer is a plain blocking std thread.
tokio = { workspace = true }
# ULID for the log id.
ulid = { workspace = true }
# fcntl(F_FULLFSYNC) and flock — the two syscalls this crate needs. Confined
# to src/ffullsync.rs, the only module that may use unsafe.
libc = { workspace = true }

[dev-dependencies]
futures = { workspace = true }

[[bin]]
name = "ramen-audit-verify"
path = "src/bin/ramen-audit-verify.rs"
