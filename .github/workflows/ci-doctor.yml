name: ci-doctor

# Deterministic CI triage. Deliberately not an agent, for the same reason
# auto-merge.yml is not one: finding the earliest failed job, pulling its
# log, and cutting out the first error block is mechanical work with a
# single correct answer.
#
# The agent version (gh-aw + local vLLM) was replaced because the enrichment
# it added — cross-run correlation, tracing a line to its introducing commit
# — was not reaching the only consumer that acts on these issues. ci-fixer
# truncates the issue body, and issue #10's report was 5364 chars against a
# 3000-char budget: 44% was discarded, including the warning that fixing the
# first lint would expose a second one. It did, and #12 went red on it.
# A terse mechanical report fits inside the budget by construction.
#
# What was genuinely lost: the "why", and repo-wide sweeps for other
# instances of the same lint. Fingerprinting recovers the dedup half.
# Humans still get the run link for anything deeper.
#
# Runs in seconds on ubuntu-latest, which also frees the self-hosted runner
# and vLLM entirely for ci-fixer, and leaves ci-fixer as the only workflow
# needing the post-compile AWF patches.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-doctor-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose the failure and file or update an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Earliest failed job: later failures are usually consequences of it.
          JOB=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion=="failure")] | sort_by(.started_at) | .[0]')
          if [ -z "$JOB" ] || [ "$JOB" = "null" ]; then
            echo "run concluded failure but no job did (cancelled or infrastructure); nothing to triage"
            exit 0
          fi
          JOB_ID=$(jq -r .id <<<"$JOB")
          JOB_NAME=$(jq -r .name <<<"$JOB")
          JOB_URL=$(jq -r .html_url <<<"$JOB")
          echo "earliest failed job: $JOB_NAME ($JOB_ID)"

          # Two ways to get the log. The REST endpoint 302s to blob storage and
          # the redirect does not always survive the default GITHUB_TOKEN, so
          # fall back to the CLI, which handles the redirect itself. Errors are
          # printed rather than swallowed: a silent "could not fetch logs" tells
          # you nothing when it happens in a scheduled run.
          # `gh run view --log` is primary. The REST endpoint is kept only as a
          # fallback: `gh api` refuses a response containing terminal escape
          # sequences ("pass --allow-escape-sequences to output it anyway"),
          # and cargo colours its output, so REST fails on exactly the logs
          # this workflow exists to read. That flag is also too new to rely on.
          if gh run view --repo "$REPO" --job "$JOB_ID" --log > raw.log 2>err.txt && [ -s raw.log ]; then
            echo "log source: gh run view"
            SOURCE=cli
          elif gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > raw.log 2>err.txt && [ -s raw.log ]; then
            echo "log source: REST"
            SOURCE=rest
          else
            echo "could not fetch logs for job $JOB_ID:"; sed 's/^/  /' err.txt || true
            exit 0
          fi

          # The CLI prefixes every line with "job<TAB>step<TAB>"; REST does
          # not. cut's default delimiter is already tab, which avoids writing
          # one into a sed bracket expression -- \t there is GNU-only, and the
          # failure mode is silent: the prefix survives, nothing matches the
          # error pattern, and the report degrades to whichever marker happens
          # to appear at a line start (run 33578330457 reported
          # "##[error]Process completed with exit code 101" as the diagnosis).
          # Applied only to CLI output so a REST log containing real tabs is
          # left alone.
          if [ "$SOURCE" = cli ]; then cut -f3- raw.log > stripped.log; else cp raw.log stripped.log; fi

          # Colour is disabled at the source (CARGO_TERM_COLOR: never in
          # ci.yaml), because cargo splits "error" from its colon with escape
          # sequences and reconstructing that downstream cost several wrong
          # diagnoses. The colour strip stays as a belt-and-braces measure for
          # any tool that ignores CARGO_TERM_COLOR, and is asserted below.
          # BOM is stripped globally, not just line 1: the CLI emits one at
          # every step boundary, and a BOM ahead of a timestamp defeats the
          # anchored timestamp strip.
          BOM=$(printf '\357\273\277')
          tr -d '\033' < stripped.log \
            | sed -E -e "s/${BOM}//g" \
                     -e 's/\^?\[[0-9;]*m//g' \
                     -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]*Z //' \
            > clean.log
          echo "log lines: $(wc -l < clean.log)  source: $SOURCE"
          # Colour codes surviving here is the exact failure that produced
          # four wrong reports, so say so loudly rather than degrading.
          DIRTY=$(grep -cE "$(printf '\033')|\^\[[0-9;]*m" clean.log || true)
          [ "$DIRTY" = 0 ] || echo "WARNING: $DIRTY lines still contain escape sequences after cleaning"

          # First error block: 20 lines from the first error marker. Cargo puts
          # the diagnostic, the source span, and clippy's suggested fix inside
          # that window. Anything that does not match falls back to the tail.
          # grep for the line number, then sed the window. Deliberately not
          # awk: `awk -v p='...\[...'` processes backslash escapes in the
          # assignment, so the pattern awk compiles is not the one written
          # here. That silently produced an empty excerpt in run 33577738204
          # while grep -q on the same pattern matched fine.
          # Two tiers. A real toolchain diagnostic always beats the runner's
          # own "##[error]Process completed with exit code N", which is true
          # of every failed step and explains nothing -- so that generic line
          # is only consulted when nothing better exists, rather than
          # competing on document order.
          # The "error:" arm is deliberately unanchored. Requiring column 0 is
          # what failed four times: any residue left in front of the word --
          # a timestamp, a job/step prefix, a colour code -- silently demotes
          # the match. Requiring the colon and a following space is enough to
          # avoid false hits like curl's --show-error.
          DIAGNOSTIC='error(\[[A-Z0-9]+\])?:[[:space:]]|^(FAILED|panicked at)|thread .* panicked'
          GENERIC='^##\[error\]'
          # `|| true` on both: under `set -o pipefail` these pipelines fail
          # either when grep matches nothing (exit 1) or when `head -1` closes
          # the pipe early and grep takes SIGPIPE -- the latter racy on match,
          # which killed run 33579386074 outright.
          first_line() { grep -nE "$1" clean.log 2>/dev/null | head -1 | cut -d: -f1 || true; }
          TRUNCATED=""
          START=$(first_line "$DIAGNOSTIC")
          if [ -z "$START" ]; then
            START=$(first_line "$GENERIC")
            if [ -n "$START" ]; then
              echo "no toolchain diagnostic found; falling back to the runner's error line"
              # Loud in the issue, not just in a run log nobody opens. Every
              # bad report this workflow filed (#13 through #17) looked
              # perfectly well-formed; the only clue was buried in the logs.
              TRUNCATED=$'\n\n> [!WARNING]\n> **This report is degraded.** No toolchain diagnostic was found, so the excerpt below is the runner\'s generic exit-code line, which explains nothing. That usually means the log could not be parsed -- most often because compiler output became colourised again (see `CARGO_TERM_COLOR` in `ci.yaml`) or the log format changed. Read the job log directly, and fix ci-doctor rather than trusting this excerpt.'
            fi
          fi
          if [ -n "$START" ]; then
            echo "first error at line $START: $(sed -n "${START}p" clean.log | cut -c1-80)"
            sed -n "${START},$((START + 19))p" clean.log > excerpt.txt
          fi
          # Also covers the case where the window came back empty for any
          # other reason -- an empty excerpt is never worth filing.
          if [ ! -s excerpt.txt ]; then
            tail -n 20 clean.log > excerpt.txt
            TRUNCATED=$'\n\n_No line matched a known error marker; showing the last 20 lines of the job log._'
          fi

          # Fingerprint on job + the first 3 lines of the excerpt, so the same
          # failure recurring across pushes collapses onto one issue instead of
          # filing a fresh one every time (14 duplicates before this existed).
          FP=$(printf '%s\n%s' "$JOB_NAME" "$(head -3 excerpt.txt)" \
            | sha256sum | cut -c1-16)
          MARKER="<!-- ci-doctor-fingerprint: $FP -->"
          echo "fingerprint: $FP"

          {
            echo "**Job \`$JOB_NAME\` failed** on \`main\` — [run #$RUN_NUMBER]($RUN_URL) at \`${HEAD_SHA:0:12}\`."
            echo
            echo "First error in [the job log]($JOB_URL):"
            echo
            echo '```'
            cat excerpt.txt
            echo '```'
            printf '%s' "$TRUNCATED"
            echo
            echo "Note: clippy and rustc abort a crate at its first error, so fixing this"
            echo "may expose a further failure in a crate that was never reached."
            echo
            echo "Filed by ci-doctor (deterministic; no model involved). The excerpt is the"
            echo "first error block, not necessarily the root cause — check the full log if"
            echo "it does not explain itself."
            echo
            echo "$MARKER"
          } > body.md

          # Update the existing issue for this fingerprint if one is open.
          EXISTING=$(gh issue list --repo "$REPO" --label ci-failure --state open \
            --limit 100 --json number,body \
            --jq "[.[] | select(.body | contains(\"$FP\"))] | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            echo "same failure as open issue #$EXISTING; commenting"
            gh issue comment "$EXISTING" --repo "$REPO" --body \
              "Still failing as of [run #$RUN_NUMBER]($RUN_URL) (\`${HEAD_SHA:0:12}\`)."
          else
            SUMMARY=$(grep -m1 -v '^[[:space:]]*$' excerpt.txt | cut -c1-110)
            TITLE="[CI failure] $JOB_NAME${SUMMARY:+: $SUMMARY}"
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label ci-failure --body-file body.md
          fi
